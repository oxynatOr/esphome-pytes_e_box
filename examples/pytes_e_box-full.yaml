# Snippet, not a complete device config: add it to your own device YAML.
# It needs the `external_components:` entry from the README (Installation).
# The include paths are relative to this file: keep the packages/ folder next to it.
packages:
  pytes_ebox_1: !include 
    file: packages/pytesebox-monitor.yaml
    vars:
      pytes_e_box_id: pvbatt
      battery_num: 1
      cell_prefix: "Cell"
      battery_prefix: "Battery"
  pytes_ebox_2: !include 
    file: packages/pytesebox-monitor.yaml
    vars:
      pytes_e_box_id: pvbatt
      battery_num: 2
      cell_prefix: "Cell"
      battery_prefix: "Battery"    
      
uart:
  tx_pin: GPIO5
  rx_pin: GPIO6
  baud_rate: 115200
  rx_buffer_size: 1024
  id: uart01   

pytes_e_box:
  - id: pvbatt
    uart_id: uart01
    update_interval: 30s
    batteries: 2
    poll_timeout: 4s
    command_idle_time: 150ms
    max_retries: 2
    connected:
      name: "BMS Connected"
    error_count:
      name: "BMS Error Count"
    total_current:
      name: "Battery System Current"
    total_power:
      name: "Battery System Power"
    average_soc:
      name: "Battery System State of Charge"


