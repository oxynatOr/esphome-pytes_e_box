# =============================================================================
# Pytes E-Box / Pylontech - Home Assistant Lovelace dashboard (built-in cards)
# =============================================================================
#
# Drop-in dashboard for a 4-battery stack monitored via the pytes_e_box
# ESPHome component. Uses only built-in Lovelace cards - no HACS required.
#
# Usage:
#   1) Settings -> Dashboards -> "+ ADD DASHBOARD" -> New dashboard from scratch
#   2) Open it, top-right "..." -> "Edit Dashboard" -> "..." -> "Raw configuration editor"
#   3) Replace the contents with this file.
#
# Assumes the sub-device package
#   examples/packages/pytesebox-monitor-sub-device.yaml
# is included 4x with battery_num: 1..4 and the defaults
#   battery_prefix: "Battery"
#   cell_prefix:    "Cell"
# which produce HA entity IDs like:
#   sensor.battery_1_voltage, sensor.battery_1_current,
#   sensor.battery_1_state_of_charge, sensor.cell_1_0_voltage, ...
#
# If your entities are named differently, search-and-replace `battery_1` (and
# `cell_1_`) with your prefix. For fewer batteries, delete the unused blocks.
#
# Note: the shipped package has the typo "Voltage Hight" -> entity ends in
# `_voltage_hight`. This dashboard uses that exact ID for compatibility.
# =============================================================================

